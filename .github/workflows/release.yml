name: Build & Release Talent Reminder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read addon version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -E '^## Version:' TalentReminder.toc | sed 's/^## Version:[[:space:]]*//')

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not read version from TalentReminder.toc"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building TalentReminder-$VERSION"

      - name: Create addon package
        shell: bash
        run: |
          rm -rf package
          mkdir -p package/TalentReminder

          cp -r Core package/TalentReminder/
          cp -r Locales package/TalentReminder/
          cp -r Options package/TalentReminder/
          cp -r Tools package/TalentReminder/
          cp -r Media package/TalentReminder/

          cp Bootstrap.lua package/TalentReminder/
          cp TalentReminder.lua package/TalentReminder/
          cp TalentReminder.toc package/TalentReminder/
          cp README.md package/TalentReminder/

      - name: Create ZIP
        shell: bash
        run: |
          cd package
          zip -r "../TalentReminder-${{ steps.version.outputs.version }}.zip" TalentReminder

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v6
        with:
          name: TalentReminder-${{ steps.version.outputs.version }}
          path: TalentReminder-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Create tag if it does not exist
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.version }}"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Talent Reminder ${{ steps.version.outputs.version }}
          files: TalentReminder-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
